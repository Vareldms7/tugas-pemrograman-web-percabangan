<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percabangan & Perulangan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Percabangan & Perulangan</h1>
    <p>Tugas Pemrograman Web</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Cek Grade Nilai</h2>
      <p class="desc">Memakai percabangan <code>if - else if - else</code>.</p>
      <label for="nilai">Masukkan nilai (0 - 100):</label>
      <input type="number" id="nilai" placeholder="contoh: 78">
      <button id="btnGrade">Cek Grade</button>
      <div id="hasilGrade" class="hasil"></div>
    </section>

    <section class="card">
      <h2>2. Tabel Perkalian</h2>
      <p class="desc">Memakai perulangan <code>for</code>.</p>
      <label for="angka">Masukkan angka (1 - 100):</label>
      <input type="number" id="angka" placeholder="contoh: 7">
      <button id="btnTabel">Tampilkan Tabel</button>
      <div id="hasilTabel" class="hasil"></div>
    </section>

  <section class="card">
      <h2>3. Jumlah Deret Bilangan</h2>
      <p class="desc">Memakai perulangan <code>while</code> dan percabangan genap/ganjil.</p>
      <label for="batas">Jumlahkan bilangan 1 sampai (1 - 1000):</label>
      <input type="number" id="batas" placeholder="contoh: 10">
      <button id="btnDeret">Hitung</button>
      <div id="hasilDeret" class="hasil"></div>
    </section>
  </main>

  <footer>
  </footer>

  <script src="script.js"></script>
</body>
</html>
